<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#f8f9fb; stroke:#2b3036; stroke-width:1.6; rx:6; ry:6; }
      .small { fill:#ffffff; stroke:#536878; stroke-width:1.2; rx:5; ry:5; }
      .label { font-family: Inter, Arial, Helvetica, sans-serif; font-size:14px; fill:#111827; }
      .title { font-weight:700; font-size:16px; }
      .ghost { fill:none; stroke:#bbb; stroke-dasharray:4 4 }
    </style>
  </defs>

  <!-- Top row -->
  <rect x="40" y="40" width="160" height="48" class="box"/>
  <text x="120" y="70" text-anchor="middle" class="label title">用户</text>

  <rect x="240" y="40" width="220" height="48" class="box"/>
  <text x="350" y="70" text-anchor="middle" class="label title">FastAPI + Web</text>

  <rect x="500" y="40" width="160" height="48" class="box"/>
  <text x="580" y="70" text-anchor="middle" class="label title">IntentRouter</text>

  <!-- Branch to chat / layered -->
  <rect x="700" y="20" width="160" height="40" class="small"/>
  <text x="780" y="45" text-anchor="middle" class="label">轻量对话</text>

  <rect x="700" y="90" width="260" height="48" class="box"/>
  <text x="830" y="120" text-anchor="middle" class="label title">LayeredTravelAgent</text>

  <!-- arrows top (curved, 分离以避免重叠) -->
  <path d="M200 64 C 260 64, 260 64, 240 64" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M460 64 C 520 64, 520 64, 500 64" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M660 64 C 720 64, 720 64, 700 64" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- branching (separate curved routes to chat and layered) -->
  <path d="M580 64 C 640 30, 740 30, 760 40" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M580 64 C 660 110, 740 120, 760 114" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layers group -->
  <g transform="translate(980,40)">
    <rect x="-220" y="-10" width="260" height="250" class="ghost" />
    <text x="-90" y="-20" class="label" style="font-weight:700;">FiveLayerMultiAgent</text>

    <rect x="-200" y="10" width="220" height="36" class="small"/>
    <text x="-90" y="34" class="label">requirement ReAct</text>

    <rect x="-200" y="60" width="220" height="36" class="small"/>
    <text x="-90" y="84" class="label">research ReAct</text>

    <rect x="-200" y="110" width="220" height="36" class="small"/>
    <text x="-90" y="134" class="label">planning ReAct</text>

    <rect x="-200" y="160" width="220" height="36" class="small"/>
    <text x="-90" y="184" class="label">risk ReAct</text>

    <rect x="-200" y="210" width="220" height="36" class="small"/>
    <text x="-90" y="234" class="label">render ReAct</text>

    <path d="M-90 46 C -90 56, -90 64, -90 74" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M-90 96 C -90 106, -90 114, -90 124" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M-90 146 C -90 156, -90 164, -90 174" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M-90 196 C -90 206, -90 214, -90 224" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />
  </g>

  <!-- Tools box -->
  <rect x="200" y="320" width="760" height="220" class="box"/>
  <text x="580" y="350" class="label title" text-anchor="middle">工具层</text>

  <g transform="translate(260,380)">
    <rect x="0" y="0" width="140" height="32" class="small"/><text x="70" y="22" text-anchor="middle" class="label">search_poi</text>
    <rect x="170" y="0" width="180" height="32" class="small"/><text x="260" y="22" text-anchor="middle" class="label">search_restaurant</text>
    <rect x="370" y="0" width="120" height="32" class="small"/><text x="430" y="22" text-anchor="middle" class="label">check_weather</text>
    <rect x="510" y="0" width="120" height="32" class="small"/><text x="570" y="22" text-anchor="middle" class="label">plan_route</text>
    <rect x="650" y="0" width="160" height="32" class="small"/><text x="730" y="22" text-anchor="middle" class="label">recommend_candidates</text>
    <rect x="0" y="60" width="200" height="32" class="small"/><text x="100" y="82" text-anchor="middle" class="label">estimate_budget</text>
    <rect x="230" y="60" width="220" height="32" class="small"/><text x="340" y="82" text-anchor="middle" class="label">plan_and_critique (子图)</text>
    <rect x="470" y="60" width="160" height="32" class="small"/><text x="550" y="82" text-anchor="middle" class="label">request_travel_info</text>
    <rect x="650" y="60" width="160" height="32" class="small"/><text x="730" y="82" text-anchor="middle" class="label">render_* / quality 卡</text>
  </g>

  <!-- connections: layered -> layers, layers -> tools, layers -> mem, layered -> metrics, fallback -->
  <!-- layered -> layers/tools (curved,避免穿插) -->
  <path d="M940 114 C 960 140, 980 180, 980 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M900 240 C 880 300, 760 320, 540 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M940 240 C 950 300, 760 320, 760 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="40" y="420" width="160" height="48" class="small"/>
  <text x="120" y="451" text-anchor="middle" class="label">三层记忆</text>
  <!-- layers -> mem (curved) -->
  <path d="M800 138 C 680 220, 560 300, 440 420" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="40" y="500" width="240" height="48" class="small"/>
  <text x="160" y="531" text-anchor="middle" class="label">ArtifactStore / metrics / eval</text>
  <path d="M120 468 C 120 486, 120 494, 120 500" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="420" y="520" width="300" height="48" class="small"/>
  <text x="570" y="551" text-anchor="middle" class="label">single ReAct / deterministic fallback</text>
  <path d="M880 138 C 820 220, 760 360, 720 540" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4" />

  <!-- footer note -->
  <text x="40" y="660" class="label" style="font-size:12px; fill:#444;">说明：本图为简化架构示意，保留主路径与工具层映射，供文档演示使用。</text>
</svg>
