[project]
name = "travel-agent"
version = "0.2.0"
description = "Personalized Travel Planning Agent（基于 LangGraph 的可控旅行规划 Agent）"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "aiofiles>=23.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
mcp = [
  "fastmcp>=0.2.0",
  "langchain-mcp-adapters>=0.1.0",
]
chinatravel = [
  "numpy>=1.24",
  "pandas>=2.0",
  "datasets>=2.18",
  "jsonschema>=4.0",
  "tqdm>=4.66",
  "geopy>=2.4",
]

[project.scripts]
travel-agent-web = "travel_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
