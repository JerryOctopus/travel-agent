<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalized Travel Planning Agent</title>
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🧭</span>
        <div>
          <h1>旅行规划 Agent</h1>
          <p class="subtitle">LangGraph ReAct · 可控规划子图 · 高德地图</p>
        </div>
      </div>
      <div class="status-pills">
        <a class="report-link" href="/dev34-report" target="_blank" rel="noopener">
          Dev34 评测报告
        </a>
        <span id="agent-mode" class="pill pill-muted">连接中…</span>
        <span id="amap-mode" class="pill pill-muted">地图未配置</span>
      </div>
    </header>

    <main class="layout">
      <section class="chat-pane">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea
            id="input"
            rows="2"
            placeholder="例如：杭州三天，喜欢美食和自然风光，节奏轻松一点"
          ></textarea>
          <button id="send">发送</button>
        </div>
        <div class="examples">
          <button class="example">帮我规划杭州三天</button>
          <button class="example">北京两天，历史+美食，轻松慢游</button>
          <button class="example">日本五天，自然风光，特种兵打卡</button>
        </div>
      </section>

      <section class="side-pane">
        <div id="map" class="map"></div>
        <div id="cards" class="cards"></div>
      </section>
    </main>

    <script src="/static/app.js?v=2"></script>
  </body>
</html>
